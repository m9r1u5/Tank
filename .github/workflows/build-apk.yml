name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'README.md' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Collect web files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js *.png www/

      - name: Create Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Allow pinch to zoom
        run: |
          F=android/app/src/main/java/com/m9r1u5/tanklevels/MainActivity.java
          cat > "$F" <<'JAVA'
          package com.m9r1u5.tanklevels;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebSettings s = getBridge().getWebView().getSettings();
                  s.setSupportZoom(true);
                  s.setBuiltInZoomControls(true);
                  s.setDisplayZoomControls(false);
                  s.setUseWideViewPort(true);
              }
          }
          JAVA
          sed -i 's/^          //' "$F"
          cat "$F"

      - name: App icon
        run: |
          for d in android/app/src/main/res/mipmap-*; do
            cp icon-192.png "$d/ic_launcher.png"
            cp icon-192.png "$d/ic_launcher_round.png"
            [ -f "$d/ic_launcher_foreground.png" ] && cp icon-192.png "$d/ic_launcher_foreground.png" || true
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Fixed signing key and version (so updates install over the old app)
        run: |
          KS="$GITHUB_WORKSPACE/.github/android/debug.keystore"
          sed -i "0,/^android {/s||android {\n    signingConfigs { debug { storeFile file('$KS'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }|" android/app/build.gradle
          VN=$(grep -o "APP_VERSION = '[0-9.]*'" index.html | grep -o "[0-9.]*[0-9]")
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VN\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../TankLevels.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TankLevels-apk
          path: TankLevels.apk

      - name: Publish as a release (download link for phones)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Tank Levels v1.0.${{ github.run_number }}
          body: Android app. Download TankLevels.apk on the phone and open it to install.
          files: TankLevels.apk
