name: Build Windows app

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/build-exe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build installer
        working-directory: desktop
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: TankLevels-Setup
          path: desktop/dist/TankLevels-Setup.exe
      - name: Publish (separate from the phone app release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows -y --cleanup-tag || true
          gh release create windows desktop/dist/TankLevels-Setup.exe --title "Tank Levels for Windows" --notes "Windows installer for Tank Levels." --latest=false
