name: Build Windows app

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/build-exe.yml']
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build installer
        working-directory: desktop
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: TankLevels-Setup
          path: desktop/dist/TankLevels-Setup.exe
